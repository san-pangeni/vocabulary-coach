<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="LexiLift is a mobile-first productive vocabulary coach with 1,000 academic, professional, and American English phrasal-verb targets.">
  <title>LexiLift Vocabulary Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="loading" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="app-logo" aria-hidden="true">L</div>
      <h1>LexiLift</h1>
      <p id="loadingText">Loading the vocabulary catalog...</p>
      <div class="loading-bar"><span id="loadingBar"></span></div>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="desktop-sidebar" aria-label="Primary navigation">
      <div class="brand-row">
        <div class="app-logo" aria-hidden="true">L</div>
        <div><strong>LexiLift</strong><small>Mobile Edition v4</small></div>
      </div>
      <nav id="desktopNav" class="desktop-nav"></nav>
      <div class="sidebar-footer">
        <button class="icon-button" data-action="theme" aria-label="Toggle dark mode">&#9790;</button>
        <span>Progress stays on this device.</span>
      </div>
    </aside>

    <div class="app-column">
      <header class="mobile-header">
        <div class="brand-row compact">
          <div class="app-logo" aria-hidden="true">L</div>
          <div><strong>LexiLift</strong><small id="headerSubtitle">Productive vocabulary</small></div>
        </div>
        <button class="icon-button" data-action="theme" aria-label="Toggle dark mode">&#9790;</button>
      </header>

      <main id="view" class="main-content" tabindex="-1"></main>

      <nav id="bottomNav" class="bottom-nav" aria-label="Mobile navigation"></nav>
    </div>
  </div>

  <div id="onboarding" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>This app requires JavaScript.</noscript>
  <script src="assets/app.js" defer></script>
</body>
</html>
